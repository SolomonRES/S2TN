<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape Room Software Design — Figma Site</title>
  <meta name="description" content="Escape Room Software Design." />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
    }
    .app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    header h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    header a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .frame {
      position: relative;
      height: calc(100vh - 48px);
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: opacity .3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden { opacity: 0; pointer-events: none; }
    .fallback {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Escape Room Software Design</h1>
      <a href="https://bronze-saved-29446430.figma.site/" target="_blank" rel="noopener">Open in new tab ↗</a>
    </header>
    <div class="frame">
      <div class="loading" id="loading">
        <div class="spinner" aria-label="Loading"></div>
        <div class="fallback" aria-live="polite">Loading Figma Site…</div>
      </div>
      <iframe
        id="figmaSite"
        src="https://bronze-saved-29446430.figma.site/"
        title="Figma Site — Escape Room Software Design"
        allowfullscreen
        onload="document.getElementById('loading').classList.add('hidden');">
      </iframe>
    </div>
  </div>
  <script>
    // error handling
    setTimeout(() => {
      const iframe = document.getElementById('figmaSite');
      if (!iframe || !iframe.contentWindow) {
        const loading = document.getElementById('loading');
        loading.classList.remove('hidden');
        loading.querySelector('.fallback').textContent = "If the embed doesn't load, click 'Open in new tab' above.";
      }
    }, 20000);
  </script>
</body>
</html>
